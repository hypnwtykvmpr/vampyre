name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          save-cache: "false"

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          version=$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            uv run --frozen python -m tools.release_bundle verify-tag --tag "$GITHUB_REF_NAME"
            git fetch origin main
            test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
          fi

      - name: Build deterministic wheel and source distribution
        shell: bash
        run: |
          uv build
          uv run --frozen python -m tools.release_bundle normalize-dist \
            --version "${{ steps.version.outputs.value }}" \
            --dist-dir dist

      - name: Validate distribution set
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -name 'graphifyy-*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -name 'graphifyy-*.tar.gz' | wc -l | tr -d ' ')" = "1"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  native-smoke:
    needs: build-distributions
    name: Native release smoke (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          save-cache: "false"

      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: distributions
          path: dist

      - name: Install wheel, execute CLI, and build platform bundle
        run: >-
          uv run --frozen python -m tools.release_bundle smoke
          --platform ${{ matrix.platform }}
          --version ${{ needs.build-distributions.outputs.version }}
          --dist-dir dist
          --output-dir release-assets

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  self-graph:
    needs: build-distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          save-cache: "false"

      - name: Install Vampyre
        run: uv sync --frozen

      - name: Build deterministic AST-only self-graph
        shell: bash
        run: |
          printf '\n*.md\n*.txt\n' >> .graphifyignore
          uv run --frozen graphify extract graphify/ --out . --multigraph --no-cluster
          uv run --frozen graphify cluster-only . --graph graphify-out/graph.json --no-label --no-viz
          uv run --frozen graphify export html --graph graphify-out/graph.json

      - name: Bundle self-graph
        run: >-
          uv run --frozen python -m tools.release_bundle graph-bundle
          --version ${{ needs.build-distributions.outputs.version }}
          --graph-dir graphify-out
          --output-dir release-assets

      - name: Upload self-graph
        uses: actions/upload-artifact@v4
        with:
          name: self-graph
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-distributions, native-smoke, self-graph]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          save-cache: "false"

      - name: Download all release assets
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify tag and write checksums
        shell: bash
        run: |
          uv run --frozen python -m tools.release_bundle verify-tag --tag "$GITHUB_REF_NAME"
          uv run --frozen python -m tools.release_bundle checksums --output release-assets/SHA256SUMS release-assets/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ needs.build-distributions.outputs.version }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
